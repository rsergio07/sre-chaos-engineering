apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: cpu-stress-chaos
  namespace: default
spec:
  appinfo:
    appns: 'default'
    applabel: 'app=chaos-target-app'
    appkind: 'deployment'
  chaosServiceAccount: litmus-admin
  engineState: 'active'
  experiments:
    - name: pod-cpu-hog
      spec:
        components:
          env:
            # Duration of CPU stress (seconds)
            - name: TOTAL_CHAOS_DURATION
              value: '120'
            
            # Number of CPU cores to stress
            - name: CPU_CORES
              value: '1'
            
            # Percentage of pods to affect
            - name: PODS_AFFECTED_PERC
              value: '33'
            
            # CPU load percentage
            - name: CPU_LOAD
              value: '100'
        
        probe:
          # HTTP probe to verify service stays available
          - name: check-service-availability
            type: httpProbe
            mode: Continuous
            runProperties:
              probeTimeout: '5'
              retry: 3
              interval: '5'
              probePollingInterval: '2'
            httpProbe/inputs:
              url: http://chaos-target-service.default.svc.cluster.local:80
              method:
                get:
                  criteria: ==
                  responseCode: "200"
          
          # Command probe to check pod status
          - name: check-pod-status
            type: cmdProbe
            mode: Edge
            runProperties:
              probeTimeout: '5'
              retry: 3
              interval: '5'
            cmdProbe/inputs:
              command: kubectl get pods -l app=chaos-target-app -n default -o jsonpath='{.items[*].status.phase}' | grep -q Running
              comparator:
                type: string
                criteria: contains
                value: Running
